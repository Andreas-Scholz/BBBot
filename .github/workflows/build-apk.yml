name: Build BlockBlastBot 4.1

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate complete Android project
        shell: bash
        run: bash make_project.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        working-directory: generated
        run: gradle wrapper --gradle-version 8.10.2

      - name: Build debug APK
        working-directory: generated
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockBlastBot-4.1-debug
          path: generated/app/build/outputs/apk/debug/app-debug.apk
